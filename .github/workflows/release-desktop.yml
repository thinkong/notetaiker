name: Release Desktop

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - canary
          - dev
          - stable
        default: canary

concurrency:
  group: release-desktop-${{ github.event.schedule || inputs.channel || 'dispatch' }}
  cancel-in-progress: true

env:
  SQLITE_VEC_VERSION: "0.1.7-alpha.2"

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.config.outputs.channel }}
      should_build: ${{ steps.config.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine channel and check for code changes
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          else
            CHANNEL="canary"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="desktop-${CHANNEL}-latest"
          CODE_PATHS=(
            "apps/desktop"
            "packages"
            "bun.lock"
            "package.json"
            "tsconfig.json"
            "turbo.json"
            ".github/workflows/release-desktop.yml"
          )

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            LAST_SHA=$(git rev-parse "$TAG")
            HEAD_SHA=$(git rev-parse HEAD)
            if git diff --quiet "$LAST_SHA..$HEAD_SHA" -- "${CODE_PATHS[@]}"; then
              echo "No code changes since last $CHANNEL build ($TAG -> $LAST_SHA)"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Code changes detected: $LAST_SHA -> $HEAD_SHA"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No previous $CHANNEL build tag found, proceeding"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: [setup]
    if: needs.setup.outputs.should_build == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
            sqlite_vec_pkg: sqlite-vec-darwin-arm64
          - os: windows-latest
            target: win-x64
            sqlite_vec_pkg: sqlite-vec-windows-x64
          - os: ubuntu-latest
            target: linux-x64
            sqlite_vec_pkg: sqlite-vec-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            sqlite_vec_pkg: sqlite-vec-linux-arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    env:
      CHANNEL: ${{ needs.setup.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
        # sudo apt-get install -y libgtk-3-0 libnss3 libgbm-dev libxkbcommon0 libasound2

      - name: Compute version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "$CHANNEL" = "stable" ]; then
            VERSION="$BASE_VERSION"
          else
            VERSION="$BASE_VERSION-$CHANNEL+$SHORT_SHA"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $CHANNEL v$VERSION for ${{ matrix.target }}"

      - name: Inject version into electrobun config
        shell: bash
        run: |
          sed -i.bak 's/version: ".*"/version: "'"$VERSION"'"/' apps/desktop/electrobun.config.ts
          rm -f apps/desktop/electrobun.config.ts.bak

      - name: Prepare platform sqlite-vec vendor
        shell: bash
        run: |
          cd apps/desktop/vendor/node_modules
          rm -rf sqlite-vec-darwin-* sqlite-vec-linux-* sqlite-vec-windows-*
          mkdir -p ${{ matrix.sqlite_vec_pkg }}
          curl -sL "https://registry.npmjs.org/${{ matrix.sqlite_vec_pkg }}/-/${{ matrix.sqlite_vec_pkg }}-${SQLITE_VEC_VERSION}.tgz" \
            | tar -xz --strip-components=1 -C ${{ matrix.sqlite_vec_pkg }}

      - name: Build desktop app
        working-directory: apps/desktop
        run: |
          bunx vite build
          bunx electrobun build --env=${{ env.CHANNEL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ env.CHANNEL }}-${{ matrix.target }}
          path: apps/desktop/artifacts/*

      - name: Attach to GitHub Release
        if: env.CHANNEL == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: apps/desktop/artifacts/*

  tag-build:
    needs: [setup, build-desktop]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update channel build tag
        run: |
          TAG="desktop-${{ needs.setup.outputs.channel }}-latest"
          git tag -f "$TAG"
          git push -f origin "$TAG"
