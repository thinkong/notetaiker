# NoteTAIker Docker Compose
# ==========================
# Quick start: docker compose up -d
# Access at: http://localhost:3001

services:
  notetaiker:
    build:
      context: .
      dockerfile: Dockerfile
    image: notetaiker:latest
    container_name: notetaiker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NOTES_DIR=/app/data/notes
      - PORT=3001
      - DOCKER_ENV=true
    volumes:
      # Bind mount your existing local directories
      - ./data:/app/data
      - ./.notetaiker:/app/.notetaiker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # Specify the driver (e.g., nvidia or amd)
              count: all     # Request all available GPUs
              capabilities: [gpu] # Ensure GPU capabilities are included
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
    # Optional: Tune for CPU performance
    environment:
      - OLLAMA_KEEP_ALIVE=24h  # Keeps Gemma 3 in RAM to avoid reload delays
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=8192
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 5 && ollama pull gemma3:4b && wait"