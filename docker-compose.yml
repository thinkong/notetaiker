# NoteTAIker Docker Compose
# ==========================
# Quick start: docker compose up -d
# Access at: http://localhost:3001

services:
  notetaiker:
    build:
      context: .
      dockerfile: Dockerfile
    image: notetaiker:latest
    container_name: notetaiker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NOTES_DIR=/app/data/notes
      - PORT=3001
    volumes:
      # Bind mount your existing local directories
      - ./data:/app/data
      - ./.notetaiker:/app/.notetaiker
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
